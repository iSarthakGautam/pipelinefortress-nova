# Security stages owned by R2: SAST (Semgrep, Bandit), SCA (Trivy, Grype, OSV-Scanner),
# IaC (Checkov, Trivy), secrets (gitleaks), then normalize -> baseline diff -> gate. Scanners
# never fail the build by themselves; only the gate decides (new findings >= HIGH, or bad
# exceptions).
name: 10 Security scan + gate

on:
  pull_request:            # every PR, including stacked PRs that don't target main
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash            # explicit shell = bash -eo pipefail

env:
  SEMGREP_VERSION: "1.179.0"
  TRIVY_VERSION: "0.75.0"
  GITLEAKS_VERSION: "8.30.1"
  GRYPE_VERSION: "0.120.1"
  OSV_SCANNER_VERSION: "2.6.0"
  PYTHON_VERSION: "3.12"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"
  # Deliberately vulnerable test data, not scan targets (eval/fixtures holds R4's synthetic
  # stand-ins for R3's files). Every scanner except gitleaks skips these; gitleaks scans git
  # history and handles fake secrets with exact allowlist values in .gitleaks.toml.
  SCAN_EXCLUDE_DIRS: "artifacts tests/fixtures eval/fixtures"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest tests -q

  scan-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # gitleaks scans full history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners (pinned, checksum-verified)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"

          # Semgrep in its own venv so its dependencies can't change the hash-locked ones above
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          ln -s "$RUNNER_TEMP/semgrep-venv/bin/semgrep" "$bin/semgrep"

          # Bandit + Checkov: hash-locked, in their own venv
          python -m venv "$RUNNER_TEMP/scanners-venv"
          "$RUNNER_TEMP/scanners-venv/bin/pip" install --quiet --require-hashes -r "$GITHUB_WORKSPACE/requirements-scanners.txt"
          ln -s "$RUNNER_TEMP/scanners-venv/bin/bandit" "$bin/bandit"
          ln -s "$RUNNER_TEMP/scanners-venv/bin/checkov" "$bin/checkov"

          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/$f"; curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$f" -C "$bin" gitleaks

          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$base/$f"; curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $f\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$f" -C "$bin" trivy

          f="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          curl -sSfLO "$base/$f"; curl -sSfLO "$base/grype_${GRYPE_VERSION}_checksums.txt"
          grep " $f\$" "grype_${GRYPE_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$f" -C "$bin" grype

          f="osv-scanner_linux_amd64"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -sSfLO "$base/$f"; curl -sSfLO "$base/osv-scanner_SHA256SUMS"
          grep " $f\$" osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 0755 "$f" "$bin/osv-scanner"

          echo "$bin" >> "$GITHUB_PATH"

      - name: Secrets (gitleaks, full history)
        run: |
          mkdir -p artifacts/scans
          gitleaks version
          # --ignore-gitleaks-allow: suppressions only via reviewed exact values in .gitleaks.toml
          gitleaks git --redact --no-banner --exit-code 0 --ignore-gitleaks-allow \
            --report-format sarif --report-path artifacts/scans/gitleaks.sarif .

      - name: SAST (Semgrep)
        run: |
          ex=(); for d in $SCAN_EXCLUDE_DIRS; do ex+=(--exclude "$d"); done
          semgrep scan --config p/default --metrics off --disable-version-check "${ex[@]}" \
            --sarif --output artifacts/scans/semgrep.sarif

      - name: SAST (Bandit, Python)
        run: |
          bandit --version | head -1
          # tests/ too: bandit flags every pytest assert (B101)
          ex="./.git,./tests"; for d in $SCAN_EXCLUDE_DIRS; do ex="$ex,./$d"; done
          bandit -q -r . -x "$ex" -f json -o artifacts/scans/bandit.json --exit-zero

      - name: IaC (Checkov)
        run: |
          checkov --version
          ex=(); for d in $SCAN_EXCLUDE_DIRS; do ex+=(--skip-path "$d"); done
          # secrets: gitleaks owns them. sca_*: needs a Prisma API key; Trivy/Grype/OSV cover SCA.
          checkov -d . --quiet --compact --soft-fail --skip-download "${ex[@]}" \
            --skip-framework secrets sca_package sca_image \
            -o sarif --output-file-path artifacts/scans/checkov
          mv artifacts/scans/checkov/results_sarif.sarif artifacts/scans/checkov.sarif

      - name: SCA + IaC (Trivy)
        run: |
          trivy --version
          ex=(); for d in $SCAN_EXCLUDE_DIRS; do ex+=(--skip-dirs "$d"); done
          trivy fs --scanners vuln,misconfig --exit-code 0 "${ex[@]}" \
            --format json --output artifacts/scans/trivy.json .

      - name: SCA cross-check (Grype)
        run: |
          grype version
          ex=(); for d in $SCAN_EXCLUDE_DIRS; do ex+=(--exclude "./$d/**"); done
          grype dir:. "${ex[@]}" --exclude './.git/**' \
            -o json --file artifacts/scans/grype.json -q

      - name: SCA cross-check (OSV-Scanner)
        run: |
          osv-scanner --version
          ex=(); for d in $SCAN_EXCLUDE_DIRS; do ex+=(--experimental-exclude "g:$d/**"); done
          set +e
          osv-scanner scan source -r "${ex[@]}" --format json --output-file artifacts/scans/osv.json .
          rc=$?
          set -e
          # 0 = clean, 1 = vulnerabilities found, 128 = no packages found; anything else is an error
          case "$rc" in
            0|1) ;;
            128) echo "osv-scanner: no packages found"; echo '{"results": []}' > artifacts/scans/osv.json ;;
            *) echo "osv-scanner failed with exit code $rc"; exit "$rc" ;;
          esac

      - name: Normalize findings
        run: |
          python scanners/normalize/normalize.py \
            --semgrep artifacts/scans/semgrep.sarif \
            --bandit artifacts/scans/bandit.json \
            --checkov artifacts/scans/checkov.sarif \
            --gitleaks artifacts/scans/gitleaks.sarif \
            --trivy artifacts/scans/trivy.json \
            --grype artifacts/scans/grype.json \
            --osv artifacts/scans/osv.json \
            --root "$GITHUB_WORKSPACE" \
            -o artifacts/findings.json

      - name: Detector overlap (metrics only, never gates)
        run: |
          python scanners/crosscheck/crosscheck.py --findings artifacts/findings.json \
            --tools trivy,grype,osv \
            -o artifacts/sca-crosscheck.json --markdown artifacts/sca-crosscheck.md
          cat artifacts/sca-crosscheck.md >> "$GITHUB_STEP_SUMMARY"

      - name: Security gate (new findings only)
        env:
          # On PRs github.sha is a temporary merge commit; record the real head commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python scanners/baseline/baseline.py check \
            --findings artifacts/findings.json \
            --baseline scanners/baseline/security-baseline.json \
            --repo . --commit "$HEAD_SHA" \
            -o artifacts/findings.diffed.json --report artifacts/gate-report.json \
            --triage-out artifacts/triage-input.json \
            > artifacts/gate-summary.txt
          rc=$?
          set -e
          cat artifacts/gate-summary.txt
          { echo '### Security gate'; echo '```'; cat artifacts/gate-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Contract check of the R2 -> R4 hand-off on this PR's real findings. No model runs here
      # (R1's 30-triage-ai job owns that), so every verdict is NEEDS_HUMAN_REVIEW; what this proves
      # is that R4's triage accepts our output and that its output is still valid schema with no
      # raw snippet in it.
      - name: Triage hand-off check (ai/triage.py, model offline)
        if: always() && hashFiles('artifacts/triage-input.json') != ''
        env:
          ARTIFACTS_BASE: ${{ github.workspace }}
          OLLAMA_BASE_URL: http://127.0.0.1:9/v1     # nothing listens: the model call fails fast
        run: |
          python ai/triage.py --comment-out artifacts/pr_comment.md \
            --metrics-out artifacts/triage-metrics.prom \
            < artifacts/triage-input.json > artifacts/findings.triaged.json
          python - <<'EOF'
          import json, sys
          sys.path.insert(0, "scanners/normalize")
          import normalize
          handed = json.load(open("artifacts/triage-input.json"))
          out = json.load(open("artifacts/findings.triaged.json"))
          assert sorted(f["finding_id"] for f in out) == sorted(f["finding_id"] for f in handed), "findings lost"
          normalize.validate(out)
          leaked = [f["finding_id"] for f in out if set(f["evidence"]) - {"raw_ref", "snippet_redacted"}]
          assert not leaked, f"raw evidence left the triage step: {leaked}"
          print(f"hand-off ok: {len(handed)} findings in, {len(out)} triaged, schema valid, no raw snippets")
          EOF
          { echo '### Triage hand-off (model offline: verdicts are placeholders)'; cat artifacts/pr_comment.md; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan
          path: |
            artifacts/scans/
            artifacts/findings.json
            artifacts/findings.diffed.json
            artifacts/gate-report.json
            artifacts/gate-summary.txt
            artifacts/sca-crosscheck.json
            artifacts/sca-crosscheck.md
            artifacts/triage-input.json
            artifacts/findings.triaged.json
            artifacts/pr_comment.md
            artifacts/triage-metrics.prom
          retention-days: 14
          if-no-files-found: warn
