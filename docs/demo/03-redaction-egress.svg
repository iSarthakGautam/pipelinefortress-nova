<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Redaction layers, pre-egress tripwire and egress guard"><title>Redaction layers, pre-egress tripwire and egress guard</title><desc>Raw finding passes L1 allowlist, L2 secrets, L3 entities, then a pre-egress canary tripwire and an exact-loopback egress guard.</desc><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1180" height="520" fill="#ffffff"/><text x="590" y="28" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">Nothing sensitive reaches a prompt, and nothing leaves loopback</text><rect x="16" y="60" width="150" height="98" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="91.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">RAW FINDING</text><text x="91.0" y="96" font-size="12" text-anchor="middle" fill="#1a1a1a">snippet, rule_id,</text><text x="91.0" y="111" font-size="12" text-anchor="middle" fill="#1a1a1a">file path as</text><text x="91.0" y="126" font-size="12" text-anchor="middle" fill="#1a1a1a">committed by a</text><text x="91.0" y="141" font-size="12" text-anchor="middle" fill="#1a1a1a">stranger</text><line x1="166" y1="105" x2="200" y2="105" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="200" y="60" width="190" height="113" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="295.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">L1 allowlist</text><text x="295.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">only: tool, rule, severity,</text><text x="295.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">CWE/CVE, file NAME, line,</text><text x="295.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">snippet. Runner ids, emails,</text><text x="295.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">full paths dropped.</text><text x="295.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">rule_id + names scrubbed</text><line x1="390" y1="110" x2="405" y2="110" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="405" y="60" width="190" height="113" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="500.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">L2 secrets</text><text x="500.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">AWS/GitHub/Slack/GCP/</text><text x="500.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">Stripe/JWT/PEM/conn-strings,</text><text x="500.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">key=value, base64-wrapped,</text><text x="500.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">split-across-lines,</text><text x="500.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">homoglyph fold, entropy</text><line x1="595" y1="110" x2="610" y2="110" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="610" y="60" width="190" height="113" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="705.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">L3 entities</text><text x="705.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">emails, private IPv4,</text><text x="705.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">IPv4 with host/ip/@ context,</text><text x="705.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">IPv6, *.internal/.corp/.svc</text><text x="705.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">version strings like</text><text x="705.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">4.17.21.0 are kept</text><line x1="800" y1="110" x2="815" y2="110" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="815" y="60" width="150" height="113" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="890.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">PROMPT</text><text x="890.0" y="96" font-size="12" text-anchor="middle" fill="#1a1a1a">redacted record, </text><text x="890.0" y="111" font-size="12" text-anchor="middle" fill="#1a1a1a">  wrapped in data </text><text x="890.0" y="126" font-size="12" text-anchor="middle" fill="#1a1a1a">  delimiters so the</text><text x="890.0" y="141" font-size="12" text-anchor="middle" fill="#1a1a1a">   model treats it </text><text x="890.0" y="156" font-size="12" text-anchor="middle" fill="#1a1a1a">  as inert</text><rect x="16" y="200" width="1148" height="150" rx="12" fill="none" stroke="#1f8a8a" stroke-width="1.5" stroke-dasharray="8 5"/><text x="28" y="218" font-size="12" text-anchor="start" fill="#1f8a8a" font-weight="700">L4  PRE-EGRESS TRIPWIRE  (a code gate; the old design put the canary INTO the prompt, which proved nothing)</text><rect x="36" y="232" width="330" height="113" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="201.0" y="250" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">A  canary self-test</text><text x="201.0" y="268" font-size="11" text-anchor="middle" fill="#1a1a1a">fake secrets that look real (AKIA..., ghp_..., an </text><text x="201.0" y="283" font-size="11" text-anchor="middle" fill="#1a1a1a">  email, a password)</text><text x="201.0" y="298" font-size="11" text-anchor="middle" fill="#1a1a1a">are pushed through the pipeline at the start of </text><text x="201.0" y="313" font-size="11" text-anchor="middle" fill="#1a1a1a">  each run.</text><text x="201.0" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">If ANY survives, no model call is made.</text><rect x="386" y="232" width="380" height="113" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="576.0" y="250" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">B  per-call leak check</text><text x="576.0" y="268" font-size="11" text-anchor="middle" fill="#1a1a1a">before each call: every secret L2 detects in the RAW </text><text x="576.0" y="283" font-size="11" text-anchor="middle" fill="#1a1a1a">  snippet,</text><text x="576.0" y="298" font-size="11" text-anchor="middle" fill="#1a1a1a">and every canary value, is searched for in the outbound </text><text x="576.0" y="313" font-size="11" text-anchor="middle" fill="#1a1a1a">  prompt.</text><text x="576.0" y="328" font-size="11" text-anchor="middle" fill="#1a1a1a">Hit =&gt; block the call, log only a COUNT (never the secret).</text><rect x="786" y="232" width="360" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="966.0" y="250" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">C  output check</text><text x="966.0" y="268" font-size="11" text-anchor="middle" fill="#1a1a1a">the model's reply is scanned for canary values too.</text><text x="966.0" y="283" font-size="11" text-anchor="middle" fill="#1a1a1a">Hit =&gt; verdict forced to NEEDS_HUMAN_REVIEW.</text><text x="966.0" y="298" font-size="11" text-anchor="middle" fill="#1a1a1a">Everything is recorded in trace.jsonl (hash chain).</text><line x1="890" y1="160" x2="890" y2="200" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><text x="890" y="186" font-size="11" text-anchor="middle" fill="#444" font-style="italic">outbound prompt</text><text x="590" y="392" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">Egress guard: deny by default</text><rect x="36" y="410" width="330" height="83" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="201.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">allowed</text><text x="201.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">scheme http/https, host EXACTLY localhost / </text><text x="201.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">  127.0.0.1 / ::1,</text><text x="201.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">no user@ part. Client ignores HTTP(S)_PROXY.</text><rect x="386" y="410" width="380" height="83" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="576.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">denied (each one is a regression test)</text><text x="576.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">localhost.evil.com   localhost@evil.com   127.0.0.1.nip.io</text><text x="576.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">api.openai.com   169.254.169.254   ftp://localhost   bad </text><text x="576.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">  port</text><rect x="786" y="410" width="360" height="78" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="966.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">every call is logged</text><text x="966.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">host, sha256(request body), allowed/denied</text><text x="966.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">artifacts/evidence/egress/egress.log</text></svg>
