<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Grounding validator: hallucination control lives in code, not in the prompt"><title>Grounding validator: hallucination control lives in code, not in the prompt</title><desc>Model output goes through claim extraction and per-claim checks against scanner record, MITRE CWE catalogue, CVE registry and repo tree; failures are dropped, logged and force NEEDS_HUMAN_REVIEW.</desc><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1180" height="520" fill="#ffffff"/><text x="590" y="28" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">The validator checks what the MODEL claims, against evidence we ship</text><rect x="16" y="60" width="280" height="158" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/><text x="156.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">MODEL OUTPUT (schema-constrained)</text><text x="156.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">{ "verdict": "TRUE_POSITIVE",</text><text x="156.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">  "confidence": 0.9,</text><text x="156.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">  "fix_summary": "Upgrade to fix</text><text x="156.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">     CVE-2031-12345 (see x.py:99)",</text><text x="156.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">  "claims": { "cves": [], "cwes": </text><text x="156.0" y="171" font-size="11" text-anchor="middle" fill="#1a1a1a">  ["CWE-99999"],</text><text x="156.0" y="186" font-size="11" text-anchor="middle" fill="#1a1a1a">     "package": null, "file": null, ... } </text><text x="156.0" y="201" font-size="11" text-anchor="middle" fill="#1a1a1a">  }</text><rect x="330" y="60" width="250" height="150" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="455.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">extract_claims()</text><text x="455.0" y="96" font-size="12" text-anchor="middle" fill="#1a1a1a">structured claims</text><text x="455.0" y="111" font-size="12" text-anchor="middle" fill="#1a1a1a">+ every CVE-/CWE- id</text><text x="455.0" y="126" font-size="12" text-anchor="middle" fill="#1a1a1a">+ every file:line</text><text x="455.0" y="141" font-size="12" text-anchor="middle" fill="#1a1a1a">found by regex in the</text><text x="455.0" y="156" font-size="12" text-anchor="middle" fill="#1a1a1a">free-text fix_summary</text><line x1="296" y1="135" x2="330" y2="135" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="614" y="60" width="540" height="150" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="884.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">check_claims(): each claim needs a source</text><text x="884.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">CWE  -&gt; MITRE catalogue, cwec v4.20, 1,391 IDs, committed offline (ai/data)</text><text x="884.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">CVE  -&gt; scanner record for THIS finding, or the offline CVE registry</text><text x="884.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">package / fixed_version -&gt; must equal the scanner record</text><text x="884.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">file : line -&gt; must equal scanner location (basename OK: the model only sees it)</text><text x="884.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">     + if VALIDATE_REPO_ROOT is set: file must exist, line within bounds</text><line x1="580" y1="135" x2="614" y2="135" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="614" y="250" width="250" height="90" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/><text x="739.0" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">PASS</text><text x="739.0" y="286" font-size="12" text-anchor="middle" fill="#1a1a1a">no unproven claim</text><text x="739.0" y="301" font-size="12" text-anchor="middle" fill="#1a1a1a">grounding.validated = true</text><text x="739.0" y="316" font-size="12" text-anchor="middle" fill="#1a1a1a">verdict stands</text><rect x="900" y="250" width="254" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="1027.0" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">FAIL</text><text x="1027.0" y="286" font-size="12" text-anchor="middle" fill="#1a1a1a">claim dropped, NO retry</text><text x="1027.0" y="301" font-size="12" text-anchor="middle" fill="#1a1a1a">verdict -&gt; NEEDS_HUMAN_REVIEW</text><text x="1027.0" y="316" font-size="12" text-anchor="middle" fill="#1a1a1a">fix text replaced (no echo)</text><line x1="884" y1="210" x2="740" y2="250" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><line x1="884" y1="210" x2="1027" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="900" y="370" width="254" height="100" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="1027.0" y="388" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">logged + counted for R5</text><text x="1027.0" y="406" font-size="11" text-anchor="middle" fill="#1a1a1a">rejections.jsonl (hash-chained)</text><text x="1027.0" y="421" font-size="11" text-anchor="middle" fill="#1a1a1a">ai_validator_rejections_total</text><text x="1027.0" y="436" font-size="11" text-anchor="middle" fill="#1a1a1a">by type: cve, cwe, location, package</text><line x1="1027" y1="340" x2="1027" y2="370" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="16" y="250" width="560" height="220" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="296.0" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">what it does and does not do</text><text x="296.0" y="286" font-size="11" text-anchor="middle" fill="#1a1a1a">REAL EXAMPLE from the eval run (llama3, finding gt-006, scanner reported a fake </text><text x="296.0" y="301" font-size="11" text-anchor="middle" fill="#1a1a1a">  CWE-99999):</text><text x="296.0" y="316" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><text x="296.0" y="331" font-size="11" text-anchor="middle" fill="#1a1a1a">  model echoed:   CWE-99999   and   package fake-pkg:1.0.0</text><text x="296.0" y="346" font-size="11" text-anchor="middle" fill="#1a1a1a">  validator:      'CWE claim not in MITRE catalogue: CWE-99999'</text><text x="296.0" y="361" font-size="11" text-anchor="middle" fill="#1a1a1a">                  'Package claim does not match scanner record'</text><text x="296.0" y="376" font-size="11" text-anchor="middle" fill="#1a1a1a">  result:         NEEDS_HUMAN_REVIEW, claim never reached a human</text><text x="296.0" y="391" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><text x="296.0" y="406" font-size="11" text-anchor="middle" fill="#1a1a1a">Ungrounded claims produced -&gt; reaching a human:</text><text x="296.0" y="421" font-size="11" text-anchor="middle" fill="#1a1a1a">  with validator 2 -&gt; 0        without validator 2 -&gt; 2</text><text x="296.0" y="436" font-size="11" text-anchor="middle" fill="#1a1a1a">The validator catches INVENTED facts. It cannot catch WRONG JUDGEMENT:</text><text x="296.0" y="451" font-size="11" text-anchor="middle" fill="#1a1a1a">llama3 still called a parameterised query (gt-002) a true positive.</text></svg>
