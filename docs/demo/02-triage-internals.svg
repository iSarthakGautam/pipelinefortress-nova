<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Inside the triage step: deterministic code around one bounded model call"><title>Inside the triage step: deterministic code around one bounded model call</title><desc>Seven deterministic stages around one model call; every failure path degrades to NEEDS_HUMAN_REVIEW with exit code 0.</desc><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="ac0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="1180" height="660" fill="#ffffff"/><text x="590" y="28" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">Inside ai/triage.py: three of four stages are ordinary, testable code</text><rect x="16" y="80" width="150" height="128" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="91.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">0 hydrate</text><text x="91.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">follow </text><text x="91.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">  evidence.raw_ref </text><text x="91.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  into SARIF for the </text><text x="91.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  real snippet and </text><text x="91.0" y="176" font-size="11" text-anchor="middle" fill="#1a1a1a">  rule id </text><text x="91.0" y="191" font-size="11" text-anchor="middle" fill="#1a1a1a">  (sarif_ref.py)</text><line x1="166" y1="140" x2="176" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="176" y="80" width="150" height="128" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="251.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">1 cluster</text><text x="251.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">honour R2's C-id, </text><text x="251.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">  else </text><text x="251.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  tool::rule::path; </text><text x="251.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  one call per </text><text x="251.0" y="176" font-size="11" text-anchor="middle" fill="#1a1a1a">  cluster </text><text x="251.0" y="191" font-size="11" text-anchor="middle" fill="#1a1a1a">  (cluster.py)</text><line x1="326" y1="140" x2="336" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="336" y="80" width="150" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="411.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">2 redact</text><text x="411.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">L1 allowlist, L2 </text><text x="411.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">  secrets + entropy, </text><text x="411.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  L3 emails / IPs / </text><text x="411.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  hosts (redactor.py)</text><line x1="486" y1="140" x2="496" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="496" y="80" width="150" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="571.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">3 inject scan</text><text x="571.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">15+ patterns, unicode</text><text x="571.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">   fold, base64 </text><text x="571.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  decode; scans </text><text x="571.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  snippet, rule id, </text><text x="571.0" y="176" font-size="11" text-anchor="middle" fill="#1a1a1a">  path</text><line x1="646" y1="140" x2="656" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="656" y="80" width="150" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="731.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">4 tripwire</text><text x="731.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">canary self-test + no</text><text x="731.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">   raw secret in the </text><text x="731.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  outbound prompt, </text><text x="731.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  else block the call</text><line x1="806" y1="140" x2="816" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="816" y="80" width="150" height="120" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/><text x="891.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">5 MODEL</text><text x="891.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">Ollama, local only; </text><text x="891.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">  T=0, seed 42; </text><text x="891.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  schema-constrained </text><text x="891.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  verdict + fix + </text><text x="891.0" y="176" font-size="11" text-anchor="middle" fill="#1a1a1a">  claims</text><line x1="966" y1="140" x2="976" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="976" y="80" width="150" height="120" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="1051.0" y="98" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">6 validate</text><text x="1051.0" y="116" font-size="11" text-anchor="middle" fill="#1a1a1a">claims vs scanner </text><text x="1051.0" y="131" font-size="11" text-anchor="middle" fill="#1a1a1a">  record, MITRE CWE, </text><text x="1051.0" y="146" font-size="11" text-anchor="middle" fill="#1a1a1a">  CVE registry, repo </text><text x="1051.0" y="161" font-size="11" text-anchor="middle" fill="#1a1a1a">  tree (validate.py)</text><text x="590" y="66" font-size="11" text-anchor="middle" fill="#555" font-style="italic">untrusted text is wrapped in &lt;UNTRUSTED_INPUT_DATA&gt; before stage 5</text><rect x="800" y="260" width="364" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="982.0" y="278" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">7 DECIDE (priority.py, triage.py)</text><text x="982.0" y="296" font-size="11" text-anchor="middle" fill="#1a1a1a">priority from severity x KEV x EPSS x reachable x </text><text x="982.0" y="311" font-size="11" text-anchor="middle" fill="#1a1a1a">  is_new; model and prompt_version stamped by code, </text><text x="982.0" y="326" font-size="11" text-anchor="middle" fill="#1a1a1a">  never from the model; snippet_raw removed, only </text><text x="982.0" y="341" font-size="11" text-anchor="middle" fill="#1a1a1a">  snippet_redacted survives</text><line x1="1051" y1="200" x2="1051" y2="260" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><text x="1100" y="232" font-size="11" text-anchor="middle" fill="#444" font-style="italic">claims that survived</text><rect x="410" y="260" width="350" height="100" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="585.0" y="278" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">8 OUTPUTS</text><text x="585.0" y="296" font-size="11" text-anchor="middle" fill="#1a1a1a">findings.triaged.json + pr_comment.md + metrics.prom</text><text x="585.0" y="311" font-size="11" text-anchor="middle" fill="#1a1a1a">trace.jsonl (hash-chained), rejections.jsonl (every </text><text x="585.0" y="326" font-size="11" text-anchor="middle" fill="#1a1a1a">  dropped claim)</text><line x1="800" y1="310" x2="760" y2="310" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="16" y="260" width="360" height="100" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/><text x="196.0" y="278" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">9 HUMAN</text><text x="196.0" y="296" font-size="11" text-anchor="middle" fill="#1a1a1a">a human reads the PR comment and decides. AI output is </text><text x="196.0" y="311" font-size="11" text-anchor="middle" fill="#1a1a1a">  advisory: it cannot merge or change anything</text><line x1="410" y1="310" x2="376" y2="310" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><text x="590" y="410" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">Every failure path ends in the same safe place</text><rect x="16" y="430" width="222" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="127.0" y="448" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">stage 3 hit</text><text x="127.0" y="466" font-size="11" text-anchor="middle" fill="#1a1a1a">injection pattern in snippet, </text><text x="127.0" y="481" font-size="11" text-anchor="middle" fill="#1a1a1a">  rule id or path</text><text x="127.0" y="496" font-size="11" text-anchor="middle" fill="#1a1a1a">P1 alert, model NOT called</text><line x1="127" y1="520" x2="127" y2="555" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="248" y="430" width="222" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="359.0" y="448" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">stage 4 hit</text><text x="359.0" y="466" font-size="11" text-anchor="middle" fill="#1a1a1a">canary or raw secret in the </text><text x="359.0" y="481" font-size="11" text-anchor="middle" fill="#1a1a1a">  prompt</text><text x="359.0" y="496" font-size="11" text-anchor="middle" fill="#1a1a1a">model NOT called, count logged</text><line x1="359" y1="520" x2="359" y2="555" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="480" y="430" width="222" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="591.0" y="448" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">stage 5 fails</text><text x="591.0" y="466" font-size="11" text-anchor="middle" fill="#1a1a1a">Ollama down, bad JSON, egress </text><text x="591.0" y="481" font-size="11" text-anchor="middle" fill="#1a1a1a">  denied</text><text x="591.0" y="496" font-size="11" text-anchor="middle" fill="#1a1a1a">model output unusable</text><line x1="591" y1="520" x2="591" y2="555" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="712" y="430" width="222" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="823.0" y="448" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">stage 5 lies</text><text x="823.0" y="466" font-size="11" text-anchor="middle" fill="#1a1a1a">wrong types, canary in output</text><text x="823.0" y="481" font-size="11" text-anchor="middle" fill="#1a1a1a">coerced or blocked</text><line x1="823" y1="520" x2="823" y2="555" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="944" y="430" width="222" height="90" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="1055.0" y="448" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">stage 6 hit</text><text x="1055.0" y="466" font-size="11" text-anchor="middle" fill="#1a1a1a">CVE, CWE, file:line, version </text><text x="1055.0" y="481" font-size="11" text-anchor="middle" fill="#1a1a1a">  unproven</text><text x="1055.0" y="496" font-size="11" text-anchor="middle" fill="#1a1a1a">claim dropped and logged</text><line x1="1055" y1="520" x2="1055" y2="555" stroke="#c0392b" stroke-width="2" marker-end="url(#ac0392b)"/><rect x="16" y="555" width="1148" height="66" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/><text x="590.0" y="573" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">SAFE OUTCOME</text><text x="590.0" y="591" font-size="11" text-anchor="middle" fill="#1a1a1a">verdict = NEEDS_HUMAN_REVIEW, priority UNASSIGNED (P1 for an injection alert), pipeline exit code 0. Abstention is a success outcome and a reported metric, not an error.</text><text x="590" y="648" font-size="11" text-anchor="middle" fill="#555" font-style="italic">Proven by tests/test_triage.py: model down =&gt; exit 0, every finding still emitted</text></svg>
