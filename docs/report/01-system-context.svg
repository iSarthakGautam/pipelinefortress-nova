<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" width="1180" height="770" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="System context: how R4&#x27;s AI triage connects to R1, R2, R3 and R5"><title>System context: how R4&#x27;s AI triage connects to R1, R2, R3 and R5</title><desc>R2 normalizer output (findings.json) flows into the R4 triage job; outputs go to R1 (PR comment), R5 (metrics, evidence) and R3/R1/R2 (draft PRs for human review).</desc><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="a2e8b57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ab59b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b59b00"/></marker></defs><rect width="1180" height="770" fill="#ffffff"/><text x="590" y="28" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">PipelineFortress: where the AI triage sits and who talks to it</text><rect x="20" y="50" width="140" height="56" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="90.0" y="68" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">Developer</text><text x="90.0" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">git push / PR</text><rect x="200" y="50" width="260" height="68" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="330.0" y="68" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R1  GitHub Actions</text><text x="330.0" y="86" font-size="12" text-anchor="middle" fill="#1a1a1a">build, test, gates; posts the PR </text><text x="330.0" y="101" font-size="12" text-anchor="middle" fill="#1a1a1a">  comment</text><line x1="160" y1="80" x2="200" y2="80" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="20" y="140" width="520" height="215" rx="12" fill="none" stroke="#777777" stroke-width="1.5" stroke-dasharray="8 5"/><text x="32" y="158" font-size="12" text-anchor="start" fill="#777777" font-weight="700">SCANNERS (parallel jobs, each writes SARIF/JSON to artifacts/)</text><rect x="32" y="168" width="118" height="83" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="91.0" y="186" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R2</text><text x="91.0" y="204" font-size="11" text-anchor="middle" fill="#1a1a1a">Semgrep, </text><text x="91.0" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">  gitleaks, </text><text x="91.0" y="234" font-size="11" text-anchor="middle" fill="#1a1a1a">  Trivy</text><rect x="160" y="168" width="118" height="70" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="219.0" y="186" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R2</text><text x="219.0" y="204" font-size="11" text-anchor="middle" fill="#1a1a1a">Checkov, OSV, </text><text x="219.0" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">  Grype</text><rect x="288" y="168" width="118" height="70" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="347.0" y="186" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R1</text><text x="347.0" y="204" font-size="11" text-anchor="middle" fill="#1a1a1a">ZAP baseline </text><text x="347.0" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">  (staging)</text><rect x="416" y="168" width="112" height="70" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="472.0" y="186" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R3</text><text x="472.0" y="204" font-size="11" text-anchor="middle" fill="#1a1a1a">Trivy image, </text><text x="472.0" y="219" font-size="11" text-anchor="middle" fill="#1a1a1a">  Syft SBOM</text><rect x="32" y="270" width="496" height="70" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2" stroke-dasharray="6 4"/><text x="280.0" y="288" font-size="11" text-anchor="middle" fill="#1a1a1a">R3 builds the planted vulns in vulnshop-api + ground_truth/planted.yaml, so </text><text x="280.0" y="303" font-size="11" text-anchor="middle" fill="#1a1a1a">  the held-out eval stays honest</text><line x1="330" y1="106" x2="330" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="40" y="395" width="480" height="90" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="280.0" y="413" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R2  NORMALIZER</text><text x="280.0" y="431" font-size="12" text-anchor="middle" fill="#1a1a1a">SARIF/JSON -&gt; unified schema; severity_norm map;</text><text x="280.0" y="446" font-size="12" text-anchor="middle" fill="#1a1a1a">dedupe.cluster_id (C-014); baseline.is_new;</text><text x="280.0" y="461" font-size="12" text-anchor="middle" fill="#1a1a1a">keeps evidence.raw_ref = pointer into the SARIF file</text><line x1="280" y1="355" x2="280" y2="395" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="40" y="520" width="480" height="56" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="280.0" y="538" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">THE HAND-OFF</text><text x="280.0" y="556" font-size="12" text-anchor="middle" fill="#1a1a1a">findings.json (the contract, schema frozen day 2)</text><line x1="280" y1="485" x2="280" y2="520" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="580" y="140" width="580" height="380" rx="12" fill="none" stroke="#1f8a8a" stroke-width="1.5" stroke-dasharray="8 5"/><text x="592" y="158" font-size="12" text-anchor="start" fill="#1f8a8a" font-weight="700">R4  AI TRIAGE: CI job 30-triage-ai (permissions: {}, no secrets, loopback only)</text><rect x="600" y="172" width="255" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="727.5" y="190" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">1  PREPARE + PROTECT</text><text x="727.5" y="208" font-size="11" text-anchor="middle" fill="#1a1a1a">hydrate, cluster, redact, injection </text><text x="727.5" y="223" font-size="11" text-anchor="middle" fill="#1a1a1a">  scan, tripwire</text><text x="727.5" y="238" font-size="11" text-anchor="middle" fill="#1a1a1a">(all deterministic code)</text><rect x="885" y="172" width="255" height="100" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/><text x="1012.5" y="190" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">2  GENERATE</text><text x="1012.5" y="208" font-size="11" text-anchor="middle" fill="#1a1a1a">local open-weight model via Ollama; </text><text x="1012.5" y="223" font-size="11" text-anchor="middle" fill="#1a1a1a">  T=0, seed 42; JSON-schema decoding; </text><text x="1012.5" y="238" font-size="11" text-anchor="middle" fill="#1a1a1a">  no tools, no credentials, cannot act</text><line x1="855" y1="222" x2="885" y2="222" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="600" y="300" width="255" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="727.5" y="318" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">3  VERIFY + DECIDE</text><text x="727.5" y="336" font-size="11" text-anchor="middle" fill="#1a1a1a">validator drops unproven claims; </text><text x="727.5" y="351" font-size="11" text-anchor="middle" fill="#1a1a1a">  priority computed from </text><text x="727.5" y="366" font-size="11" text-anchor="middle" fill="#1a1a1a">  severity/KEV/EPSS; model + prompt </text><text x="727.5" y="381" font-size="11" text-anchor="middle" fill="#1a1a1a">  version set by code</text><line x1="1012" y1="272" x2="760" y2="300" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><rect x="885" y="300" width="255" height="100" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/><text x="1012.5" y="318" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">FALLBACK</text><text x="1012.5" y="336" font-size="11" text-anchor="middle" fill="#1a1a1a">model down or junk output =&gt; </text><text x="1012.5" y="351" font-size="11" text-anchor="middle" fill="#1a1a1a">  NEEDS_HUMAN_REVIEW, exit code 0 </text><text x="1012.5" y="366" font-size="11" text-anchor="middle" fill="#1a1a1a">  (degrade, never block)</text><rect x="600" y="425" width="540" height="80" rx="8" fill="#fffbe0" stroke="#b59b00" stroke-width="2"/><text x="870.0" y="443" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">OUTPUTS</text><text x="870.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">findings.triaged.json (same schema, triage block filled) | pr_comment.md | </text><text x="870.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">  metrics.prom | llm_trace/ + egress.log</text><line x1="760" y1="400" x2="760" y2="425" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><line x1="520" y1="548" x2="580" y2="400" stroke="#b59b00" stroke-width="2" marker-end="url(#ab59b00)"/><text x="495" y="470" font-size="11" text-anchor="middle" fill="#b59b00" font-style="italic">findings.json</text><rect x="600" y="580" width="175" height="130" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/><text x="687.5" y="598" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">HUMAN MERGES</text><text x="687.5" y="616" font-size="11" text-anchor="middle" fill="#1a1a1a">R4 pr_bot drafts </text><text x="687.5" y="631" font-size="11" text-anchor="middle" fill="#1a1a1a">  mechanical patches as </text><text x="687.5" y="646" font-size="11" text-anchor="middle" fill="#1a1a1a">  DRAFT PRs; R1/R2/R3 </text><text x="687.5" y="661" font-size="11" text-anchor="middle" fill="#1a1a1a">  review and write the </text><text x="687.5" y="676" font-size="11" text-anchor="middle" fill="#1a1a1a">  notes</text><rect x="795" y="580" width="175" height="130" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="882.5" y="598" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R1 consumes</text><text x="882.5" y="616" font-size="11" text-anchor="middle" fill="#1a1a1a">PR comment posted by the </text><text x="882.5" y="631" font-size="11" text-anchor="middle" fill="#1a1a1a">  workflow; the job stays</text><text x="882.5" y="646" font-size="11" text-anchor="middle" fill="#1a1a1a">   green even if the </text><text x="882.5" y="661" font-size="11" text-anchor="middle" fill="#1a1a1a">  model is down</text><rect x="990" y="580" width="170" height="130" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="1075.0" y="598" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R5 consumes</text><text x="1075.0" y="616" font-size="11" text-anchor="middle" fill="#1a1a1a">metrics.prom to </text><text x="1075.0" y="631" font-size="11" text-anchor="middle" fill="#1a1a1a">  Prometheus/Grafana; </text><text x="1075.0" y="646" font-size="11" text-anchor="middle" fill="#1a1a1a">  results + traces as </text><text x="1075.0" y="661" font-size="11" text-anchor="middle" fill="#1a1a1a">  report evidence; ground</text><text x="1075.0" y="676" font-size="11" text-anchor="middle" fill="#1a1a1a">   truth + kappa</text><line x1="687" y1="505" x2="687" y2="580" stroke="#2e8b57" stroke-width="2" marker-end="url(#a2e8b57)"/><text x="720" y="545" font-size="11" text-anchor="middle" fill="#2e8b57" font-style="italic">draft fixes</text><line x1="882" y1="505" x2="882" y2="580" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><text x="915" y="545" font-size="11" text-anchor="middle" fill="#444" font-style="italic">comment</text><line x1="1075" y1="505" x2="1075" y2="580" stroke="#444" stroke-width="2" marker-end="url(#a444)"/><text x="1105" y="545" font-size="11" text-anchor="middle" fill="#444" font-style="italic">metrics</text><rect x="40" y="620" width="480" height="90" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="280.0" y="638" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R3 supplies / receives</text><text x="280.0" y="656" font-size="11" text-anchor="middle" fill="#1a1a1a">Dockerfile, k8s manifests, vulnshop-api = the files pr_bot patches</text><text x="280.0" y="671" font-size="11" text-anchor="middle" fill="#1a1a1a">model licences + digests -&gt; docs/LICENSES.md and the SBOM</text><line x1="520" y1="665" x2="600" y2="650" stroke="#444" stroke-width="2" marker-end="url(#a444)" stroke-dasharray="5 4"/><text x="555" y="640" font-size="11" text-anchor="middle" fill="#444" font-style="italic">target files</text></svg>
