# gitleaks config. Owner: R2. Extends the default ruleset.
# Allowlist entries are EXACT known-fake values, never paths or whole rules, so a real
# or planted secret in the same file is still caught. Every entry needs a reason.
# The one non-exact entry (baseline match_key hashes) is still pinned to one rule, one file
# AND a 16-hex-digit format: those values are regenerated on every rebaseline.
title = "PipelineFortress gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "R4 L4 canary token (ai/redaction/redactor.py). A tripwire that must look like a secret."
regexes = ['''^CANARY_[0-9a-f]{6}_SECRET$''']

[[allowlists]]
description = "Public jwt.io example token (John Doe, iat 1516239022) used as a redaction test fixture."
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.''']

[[allowlists]]
description = "R4 redaction-test JWT (tests/test_redaction.py, test_l2_known_shapes): HS256, payload {\"sub\":\"1234567890\"}, a shortened jwt.io example."
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c$''']

[[allowlists]]
description = "Baseline match_key: sha256 prefix generated by scanners/baseline/baseline.py, not a credential. generic-api-key fires on the word 'key' next to high-entropy hex."
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^scanners/baseline/security-baseline\.json$''']
regexTarget = "line"
regexes = ['''^\s*"match_key": "[0-9a-f]{16}",?$''']
