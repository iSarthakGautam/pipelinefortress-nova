# PipelineFortress custom rule. Owner: R2. Planted class: PLANT-003.
# gitleaks owns secret detection, but its default rules skip AWS's documented example key, which
# is what PLANT-003 plants. This catches the class (a credential-named variable holding a literal)
# whatever the value looks like. Tests: tests/semgrep/python-hardcoded-credential.py
rules:
  - id: pf-python-hardcoded-credential
    languages: [python]
    severity: ERROR
    message: >-
      $NAME is set to a hard-coded value. Anyone with read access to the repository (or its history)
      has this credential. Read it from the environment or a secret manager, and rotate it if it was
      ever real.
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      category: security
      confidence: MEDIUM
      planted: [PLANT-003]
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $OBJ.$NAME = "$VALUE"
          - pattern: $FUNC(..., $NAME="$VALUE", ...)
      # No "token": R4's redaction canary (CANARY_TOKEN) is a deliberate fake, and token formats
      # (ghp_, xoxb-, JWTs) are what gitleaks' rules are good at
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^\w*(secret|passw(or)?d|passwd|pwd|api_?key|access_?key|private_?key|aws_?key|credential)\w*$
      # 8+ characters, and not an obvious placeholder
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^.{8,}$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^(?!.*(changeme|change_me|placeholder|your[_-]|<[^>]*>|\$\{|xxxx|redacted)).*$
