# Hardened Kubernetes Deployment Manifest (R3 Deliverable)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnshop-api
  labels:
    app.kubernetes.io/name: vulnshop-api
    app.kubernetes.io/part-of: pipelinefortress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vulnshop-api
  template:
    metadata:
      labels:
        app: vulnshop-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vulnshop-api
          image: vulnshop-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

