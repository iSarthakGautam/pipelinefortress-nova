<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="The unified finding schema: who writes which field"><title>The unified finding schema: who writes which field</title><desc>Schema fields by owner: R2 deterministic input, R4-filled enrichment and code-set triage fields, model-produced verdict/confidence/fix_summary, and consumers R1, R5, R3.</desc><defs><marker id="a444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><rect width="1180" height="600" fill="#ffffff"/><text x="590" y="28" font-size="17" text-anchor="middle" fill="#1a1a1a" font-weight="700">One contract, one boundary: everything under `triage` is the model, everything else is code</text><rect x="16" y="60" width="360" height="300" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="196.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R2 OWNS (deterministic)</text><text x="196.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">finding_id, tool, severity_norm</text><text x="196.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">cwe[], cve[]</text><text x="196.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">location { file, line }</text><text x="196.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">package { name, version, fixed_version }</text><text x="196.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">evidence.raw_ref  &lt;- pointer into SARIF</text><text x="196.0" y="171" font-size="11" text-anchor="middle" fill="#1a1a1a">evidence.snippet_redacted  (R2 placeholder)</text><text x="196.0" y="186" font-size="11" text-anchor="middle" fill="#1a1a1a">baseline { is_new, first_seen_commit }</text><text x="196.0" y="201" font-size="11" text-anchor="middle" fill="#1a1a1a">dedupe.cluster_id  (R4 honours it)</text><text x="196.0" y="216" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><text x="196.0" y="231" font-size="11" text-anchor="middle" fill="#1a1a1a">R4 READS these. R4 never changes them.</text><text x="196.0" y="246" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><text x="196.0" y="261" font-size="11" text-anchor="middle" fill="#1a1a1a">ASK to R2: raw_ref must be resolvable on the</text><text x="196.0" y="276" font-size="11" text-anchor="middle" fill="#1a1a1a">runner (set ARTIFACTS_BASE); severity_norm</text><text x="196.0" y="291" font-size="11" text-anchor="middle" fill="#1a1a1a">present; keep cluster ids stable between runs.</text><rect x="410" y="60" width="340" height="150" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="580.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R4 FILLS (deterministic code)</text><text x="580.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">enrichment { epss, kev, reachable }</text><text x="580.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a"></text><text x="580.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">offline tables only, never fetched at inference.</text><text x="580.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">epss = null when unknown (not invented).</text><text x="580.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">reachable = null: reachability is NOT computed yet.</text><text x="580.0" y="171" font-size="11" text-anchor="middle" fill="#1a1a1a">dedupe.cluster_size filled in by R4.</text><rect x="410" y="230" width="340" height="130" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/><text x="580.0" y="248" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">triage.* set by CODE</text><text x="580.0" y="266" font-size="11" text-anchor="middle" fill="#1a1a1a">priority   from severity/KEV/EPSS/is_new</text><text x="580.0" y="281" font-size="11" text-anchor="middle" fill="#1a1a1a">model      e.g. llama3:latest@sha256:365c0bd3c000</text><text x="580.0" y="296" font-size="11" text-anchor="middle" fill="#1a1a1a">prompt_version   triage_v2/2.0.0</text><text x="580.0" y="311" font-size="11" text-anchor="middle" fill="#1a1a1a">grounding { validated, rejected_claims }</text><rect x="784" y="60" width="380" height="150" rx="8" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/><text x="974.0" y="78" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">triage.* from the MODEL</text><text x="974.0" y="96" font-size="11" text-anchor="middle" fill="#1a1a1a">verdict: TRUE_POSITIVE, FALSE_POSITIVE or</text><text x="974.0" y="111" font-size="11" text-anchor="middle" fill="#1a1a1a">NEEDS_HUMAN_REVIEW</text><text x="974.0" y="126" font-size="11" text-anchor="middle" fill="#1a1a1a">confidence   0..1 (bad types coerced to 0.0)</text><text x="974.0" y="141" font-size="11" text-anchor="middle" fill="#1a1a1a">fix_summary  1-3 sentences</text><text x="974.0" y="156" font-size="11" text-anchor="middle" fill="#1a1a1a">claims       validated, then removed from output</text><rect x="784" y="230" width="380" height="130" rx="8" fill="#fde8e8" stroke="#c0392b" stroke-width="2"/><text x="974.0" y="248" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">what never crosses the boundary</text><text x="974.0" y="266" font-size="11" text-anchor="middle" fill="#1a1a1a">`snippet_raw` is read on the runner, redacted, and then</text><text x="974.0" y="281" font-size="11" text-anchor="middle" fill="#1a1a1a">REMOVED: it never appears in any output file.</text><text x="974.0" y="296" font-size="11" text-anchor="middle" fill="#1a1a1a">The model cannot set priority, model name or</text><text x="974.0" y="311" font-size="11" text-anchor="middle" fill="#1a1a1a">prompt version: a model that claims 'gpt-9-ultra'</text><text x="974.0" y="326" font-size="11" text-anchor="middle" fill="#1a1a1a">is ignored (regression test).</text><text x="590" y="396" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="700">Consumers of the output</text><rect x="16" y="410" width="270" height="150" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="151.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R1</text><text x="151.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">pr_comment.md: counts, P1/P2 table,</text><text x="151.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">'needs a human' table. No snippets;</text><text x="151.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">model text HTML-escaped, links and</text><text x="151.0" y="491" font-size="11" text-anchor="middle" fill="#1a1a1a">@mentions neutralised.</text><text x="151.0" y="506" font-size="11" text-anchor="middle" fill="#1a1a1a">Posted by R1's workflow step.</text><rect x="310" y="410" width="270" height="150" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="445.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R5</text><text x="445.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">metrics.prom (Prometheus text):</text><text x="445.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">findings, clusters, verdict_total</text><text x="445.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">(abstentions!), validator rejections</text><text x="445.0" y="491" font-size="11" text-anchor="middle" fill="#1a1a1a">by type, outcomes, latency.</text><text x="445.0" y="506" font-size="11" text-anchor="middle" fill="#1a1a1a">Textfile collector or pushgateway.</text><rect x="604" y="410" width="270" height="150" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="739.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R3</text><text x="739.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">pr_bot reads files R3 owns,</text><text x="739.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">drafts a patch, runs git apply --check,</text><text x="739.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">leaves review = PENDING.</text><text x="739.0" y="491" font-size="11" text-anchor="middle" fill="#1a1a1a">model licences + digests from</text><text x="739.0" y="506" font-size="11" text-anchor="middle" fill="#1a1a1a">models.lock.yaml -&gt; LICENSES.md / SBOM.</text><rect x="898" y="410" width="266" height="150" rx="8" fill="#f3f3f3" stroke="#777777" stroke-width="2"/><text x="1031.0" y="428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">R5 (evidence, eval)</text><text x="1031.0" y="446" font-size="11" text-anchor="middle" fill="#1a1a1a">results/*.jsonl, results.md,</text><text x="1031.0" y="461" font-size="11" text-anchor="middle" fill="#1a1a1a">trace.jsonl, egress.log = evidence</text><text x="1031.0" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">for the report. Ground truth must</text><text x="1031.0" y="491" font-size="11" text-anchor="middle" fill="#1a1a1a">come from real findings + planted.yaml,</text><text x="1031.0" y="506" font-size="11" text-anchor="middle" fill="#1a1a1a">labelled by several people (kappa).</text></svg>
