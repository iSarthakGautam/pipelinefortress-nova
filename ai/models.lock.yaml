# Pinned models. `digest` is the Ollama manifest digest from `curl localhost:11434/api/tags` (full sha256).
# ai/llm_client.py compares the live digest to this file and records both in the trace.
# Models marked installed: false are the plan's intended models; they are NOT pulled on the capture machine,
# so they have no digest yet and have NEVER been evaluated. Do not cite results for them.
# TODO(R3): copy the licence rows into docs/LICENSES.md and merge `python3 eval/stubs/r3_model_sbom_stub.py` output into the SBOM.
# TODO(R4): pull qwen2.5-coder and llama3.1:8b, pin their digests, then run eval/run_eval.py with them.
models:
  - tag: "llama3:latest"
    family: "llama3"
    parameters: "8.0B"
    quantisation: "Q4_0"
    digest: "sha256:365c0bd3c000a25d28ddbf732fe1c6add414de7275464c4e4d1c3b5fcb5d8ad1"
    provider: "ollama"
    installed: true
    is_default: true
    license: "Meta Llama 3 Community License"
    license_osi_approved: false
    source_url: "https://ollama.com/library/llama3"
    rationale: "Installed locally; used for every run recorded in eval/results/."

  - tag: "gemma2:latest"
